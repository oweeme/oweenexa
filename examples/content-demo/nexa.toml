[project]
name = "content-demo"
version = "0.1.0"

# Redirecciones: un enlace viejo sigue funcionando.
[redirects]
"/articulos" = "/blog"
"/guia/:pagina" = { to = "/docs/guia/:pagina", status = 302 }

# Content-Security-Policy SIN 'unsafe-inline': cada página lleva el hash de sus scripts en línea.
[security]
csp = "default-src 'self'; img-src 'self' data:"

# Cabeceras propias por ruta.
[headers."/*"]
X-Demo = "content-demo"

# Feed RSS: `nexa build` escribe dist/feed.xml a partir del blog y enlaza el feed en el <head> de cada página.
[feed]
title = "Content demo"
description = "Artículos de ejemplo"
source = "content:/posts"
link = "/blog/:slug"
