name: Release

# Al subir una etiqueta `vX.Y.Z` se compila `nexa` para cada sistema y se adjunta a la release. Esos binarios
# son también el `--runtime` de `nexa bundle` para empaquetar un sitio para OTRO sistema operativo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: nexa (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "", archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "", archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "", archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Compilar
        run: cargo build --release -p nexa-cli --target ${{ matrix.target }}
      - name: Empaquetar
        shell: bash
        run: |
          name="nexa-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/nexa${{ matrix.ext }}" LICENSE README.md "$name/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$name.${{ matrix.archive }}" > "$name.${{ matrix.archive }}.sha256"
          else shasum -a 256 "$name.${{ matrix.archive }}" > "$name.${{ matrix.archive }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-${{ matrix.target }}
          path: |
            nexa-${{ matrix.target }}.${{ matrix.archive }}
            nexa-${{ matrix.target }}.${{ matrix.archive }}.sha256

  publish:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
